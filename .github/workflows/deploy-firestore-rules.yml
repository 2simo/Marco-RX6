name: Test and Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - "tests/firestore.rules.test.mjs"
      - ".github/workflows/deploy-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test rules, then deploy only if tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Firebase CLI and rules test dependencies
        run: npm install --no-save --no-package-lock "firebase@^11.0.0" "@firebase/rules-unit-testing@^4.0.1" "firebase-tools@^14.0.0"

      - name: Run Firestore security rules tests
        run: npx firebase emulators:exec --only firestore --project demo-marco-rx6 "node --test tests/firestore.rules.test.mjs"

      - name: Check whether Firebase deployment credentials are configured
        id: credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rules tests passed, but deployment was skipped. Add the FIREBASE_SERVICE_ACCOUNT repository secret to enable automatic deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare service-account credentials
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          credentials_file="$RUNNER_TEMP/marco-rx6-firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_file"
          python -m json.tool "$credentials_file" > /dev/null
          chmod 600 "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules only
        if: steps.credentials.outputs.configured == 'true'
        run: npx firebase deploy --only firestore:rules --project marco-rx6-v2 --non-interactive

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/marco-rx6-firebase-service-account.json"
