name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - name: Check whether Firebase credentials are configured
        id: credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Add the FIREBASE_SERVICE_ACCOUNT repository secret to enable automatic deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        if: steps.credentials.outputs.configured == 'true'
        run: npm install --global firebase-tools

      - name: Prepare service-account credentials
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          credentials_file="$RUNNER_TEMP/marco-rx6-firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_file"
          python -m json.tool "$credentials_file" > /dev/null
          chmod 600 "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules only
        if: steps.credentials.outputs.configured == 'true'
        run: firebase deploy --only firestore:rules --project marco-rx6-v2 --non-interactive

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/marco-rx6-firebase-service-account.json"
