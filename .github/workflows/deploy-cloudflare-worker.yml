name: Deploy MARCO RX6 notification Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/marco-rx6-notifications/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marco-rx6-notifications-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy notification Worker to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Check whether Cloudflare credentials are configured
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Deploy Worker with Wrangler
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/marco-rx6-notifications/wrangler.toml
