name: MARCO RX6 scheduled FCM notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/send_fcm_notifications.mjs"
      - ".github/workflows/send-fcm-notifications.yml"

permissions:
  contents: read

concurrency:
  group: marco-rx6-fcm-sender
  cancel-in-progress: false

jobs:
  send-pending-notifications:
    name: Send pending notifications through Firebase FCM
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Firebase service account secret
        id: credentials
        shell: bash
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing FCM_SERVICE_ACCOUNT_JSON repository secret."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Prepare Firebase credentials
        shell: bash
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          credentials_file="$RUNNER_TEMP/marco-rx6-firebase-service-account.json"
          printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          python -m json.tool "$credentials_file" > /dev/null
          chmod 600 "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Install Google authentication library
        run: npm install --no-save --no-package-lock "google-auth-library@^10.0.0"

      - name: Send pending FCM notifications
        run: node scripts/send_fcm_notifications.mjs

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/marco-rx6-firebase-service-account.json"
