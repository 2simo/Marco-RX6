
name: Build Marco RX6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - redesign/game-catalog-ui

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare offline game artwork and catalog
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.1.0
          python3 tools/fetch_offline_covers.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/marcorx6-release.jks"
          test -s "$RUNNER_TEMP/marcorx6-release.jks"

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/marcorx6-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marco-RX6-APK
          path: app/build/outputs/apk/release/app-release.apk
