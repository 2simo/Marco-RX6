name: Build Marco RX6 APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
      - maintenance/audit-8.16
      - feature/next-development

permissions:
  contents: read

# Keep only the newest build for a branch; rapid fixes should not queue stale APK builds.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare offline game artwork and catalog
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.1.0
          python3 tools/fetch_offline_covers.py

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/marcorx6-release.jks"
          test -s "$RUNNER_TEMP/marcorx6-release.jks"

      - name: Run unit tests
        run: gradle --no-daemon testReleaseUnitTest

      - name: Run Android lint checks
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/marcorx6-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon lintRelease

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/marcorx6-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Build debug APK with the registered OAuth certificate
        env:
          MARCO_DEBUG_USE_RELEASE_KEY: "true"
          KEYSTORE_FILE: ${{ runner.temp }}/marcorx6-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Verify debug and release certificates match
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          test -n "$APKSIGNER"
          RELEASE_CERT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
          RELEASE_CERT_SHA1="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk '/certificate SHA-1 digest:/ {print $NF; exit}')"
          DEBUG_CERT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
          test -n "$RELEASE_CERT"
          test -n "$RELEASE_CERT_SHA1"
          test "$DEBUG_CERT" = "$RELEASE_CERT"
          echo "Firebase Android release SHA-1: $RELEASE_CERT_SHA1"
          echo "Firebase Android release SHA-256: $RELEASE_CERT"

      - name: Upload Release APK for device testing
        uses: actions/upload-artifact@v7
        with:
          name: marco-rx6-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3
