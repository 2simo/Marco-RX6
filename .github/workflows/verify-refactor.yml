name: Verify refactor branch

on:
  push:
    branches:
      - refactor/split-mainactivity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/marcorx6-release.jks"
          test -s "$RUNNER_TEMP/marcorx6-release.jks"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon lintDebug

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/marcorx6-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Build debug APK with release OAuth certificate
        env:
          MARCO_DEBUG_USE_RELEASE_KEY: "true"
          KEYSTORE_FILE: ${{ runner.temp }}/marcorx6-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Verify debug and release signing certificates
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          test -n "$APKSIGNER"
          echo "Release APK signer:"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          echo "Debug APK signer:"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          RELEASE_CERT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F': ' '/certificate SHA-256 digest:/ {print $3; exit}')"
          DEBUG_CERT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | awk -F': ' '/certificate SHA-256 digest:/ {print $3; exit}')"
          test -n "$RELEASE_CERT"
          test -n "$DEBUG_CERT"
          echo "Release SHA-256: $RELEASE_CERT"
          echo "Debug SHA-256:   $DEBUG_CERT"
          test "$DEBUG_CERT" = "$RELEASE_CERT"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: marco-rx6-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: marco-rx6-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
